[package]
name = "teamshell-cli"
version = "2.0.0"
edition = "2021"
description = "TeamShell CLI tool - Agent communication via IPC"

[[bin]]
name = "tsh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

teamshell-ipc.workspace = true
dirs-next.workspace = true
